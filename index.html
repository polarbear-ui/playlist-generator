<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* 1. 포인트 컬러를 변수로 지정 (JS에서 변경 가능) */
  :root {
    --point-color: #ff3366; 
  }

  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f4f7f6; padding: 20px; }
  
  .generator-section {
    max-width: 500px;
    margin: 0 auto 30px auto;
    background: #fff;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }

  /* 커스텀 설정 입력창 스타일 */
  .config-row { display: flex; gap: 10px; margin-bottom: 15px; }
  .config-row input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
  .config-row input[type="color"] { flex: 0.3; height: 40px; padding: 2px; cursor: pointer; }

  .generator-section textarea {
    width: 100%; height: 120px; padding: 15px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; resize: vertical; box-sizing: border-box; margin-bottom: 10px;
  }

  .generate-btn {
    width: 100%; background: #222; color: #fff; border: none;
    padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold;
  }

  /* 2. 플레이어 레이아웃: 모바일 비율로 고정 */
  .player-wrapper {
    display: none;
    flex-direction: column; /* 항상 위아래로 나열 */
    width: 100%;
    max-width: 400px; /* 휴대폰 너비로 고정 */
    margin: 0 auto;
    gap: 15px;
  }

  .panel { background: #eef2f6; border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
  .playlist-header { font-size: 1.3em; font-weight: bold; color: #222; margin-bottom: 15px; }
  .song-list { list-style: none; padding: 0; margin: 0; }
  
  .song-item {
    display: flex; align-items: center; background: #fff; border-radius: 14px;
    margin-bottom: 10px; padding: 12px; cursor: pointer; border: 2px solid transparent;
  }
  .song-item.active { border: 2px solid var(--point-color); } /* 변수 사용 */
  
  .play-icon {
    width: 30px; height: 30px; background: #333; color: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; margin-right: 12px; font-size: 10px;
  }
  .song-title { font-weight: bold; color: #222; font-size: 0.95em; }
  .song-artist { font-size: 0.8em; color: #888; }

  .details-panel { display: flex; flex-direction: column; gap: 15px; }
  .details-header { font-size: 1.1em; font-weight: bold; color: #333; border-bottom: 2px solid #ddd; padding-bottom: 8px; }
  
  .lyrics-section { background: #fff; padding: 15px; border-radius: 14px; min-height: 120px; text-align: center; }
  .lyric-line { font-size: 0.95em; color: #bbb; margin: 6px 0; transition: all 0.3s; }
  .lyric-line.active-lyric { color: var(--point-color); font-weight: bold; transform: scale(1.05); } /* 변수 사용 */
  
  .desc-section { background: #fff; padding: 15px; border-radius: 14px; font-size: 0.85em; color: #555; line-height: 1.6; }
</style>
</head>
<body>

<div class="generator-section">
  <h3>플레이리스트 설정</h3>
  <div class="config-row">
    <input type="text" id="title-input" placeholder="플레이리스트 제목 (예: My Mood)">
    <input type="color" id="color-input" value="#ff3366" title="포인트 컬러 선택">
  </div>
  <textarea id="data-input" placeholder="AI가 출력한 텍스트 양식을 붙여넣으세요..."></textarea>
  <button class="generate-btn" onclick="parseAndGenerate()">플레이리스트 생성 및 적용</button>
</div>

<div class="player-wrapper" id="player-wrapper">
  <div class="panel">
    <div class="playlist-header" id="display-title">Your Playlist</div>
    <ul class="song-list" id="playlist-container"></ul>
  </div>

  <div class="panel details-panel">
    <div class="details-header" id="current-title">곡을 선택하세요</div>
    <div class="lyrics-section" id="lyrics-container"></div>
    <div class="desc-section" id="desc-container"></div>
  </div>
</div>

<script>
  let songData = [];
  let lyricTimer = null;

  function parseAndGenerate() {
    const rawText = document.getElementById('data-input').value;
    const customTitle = document.getElementById('title-input').value;
    const customColor = document.getElementById('color-input').value;

    if (!rawText.trim()) return alert("텍스트를 입력해주세요.");

    // 1. 커스텀 설정 적용
    document.getElementById('display-title').innerText = customTitle || "Your Playlist";
    document.documentElement.style.setProperty('--point-color', customColor); // CSS 변수 업데이트

    // 2. 텍스트 파싱 (이전과 동일)
    const blocks = rawText.split(/---+/);
    const parsedData = [];

    blocks.forEach(block => {
      const lines = block.trim().split('\n');
      if (lines.length < 3) return;
      const song = { title: '', artist: '', description: '', lyrics: [] };
      let isParsingLyrics = false;

      lines.forEach(line => {
        const tLine = line.trim();
        if (tLine.startsWith('곡명:')) song.title = tLine.replace('곡명:', '').trim();
        else if (tLine.startsWith('아티스트:')) song.artist = tLine.replace('아티스트:', '').trim();
        else if (tLine.startsWith('설명:')) song.description = tLine.replace('설명:', '').trim();
        else if (tLine.startsWith('가사:')) isParsingLyrics = true;
        else if (isParsingLyrics && tLine.length > 0) song.lyrics.push(tLine);
      });
      if (song.title) parsedData.push(song);
    });

    songData = parsedData;
    renderPlaylist();
    document.getElementById('player-wrapper').style.display = 'flex';
  }

  function renderPlaylist() {
    const container = document.getElementById('playlist-container');
    container.innerHTML = '';
    songData.forEach((song, index) => {
      const li = document.createElement('li');
      li.className = 'song-item';
      li.innerHTML = `<div class="play-icon">▶</div><div class="song-info"><div class="song-title">${song.title}</div><div class="song-artist">${song.artist}</div></div>`;
      li.onclick = () => selectSong(index, li);
      container.appendChild(li);
    });
    if(songData.length > 0) selectSong(0, container.firstChild);
  }

  function selectSong(index, element) {
    document.querySelectorAll('.song-item').forEach(item => item.classList.remove('active'));
    element.classList.add('active');
    const song = songData[index];
    document.getElementById('current-title').innerText = `${song.title} - ${song.artist}`;
    document.getElementById('desc-container').innerText = song.description;
    const lyricsContainer = document.getElementById('lyrics-container');
    lyricsContainer.innerHTML = '';
    song.lyrics.forEach(line => {
      const div = document.createElement('div');
      div.className = 'lyric-line';
      div.innerText = line;
      lyricsContainer.appendChild(div);
    });
    startLyricAnimation(lyricsContainer);
  }

  function startLyricAnimation(container) {
    clearInterval(lyricTimer);
    const lines = container.querySelectorAll('.lyric-line');
    if (lines.length === 0) return;
    let idx = 0;
    lines[0].classList.add('active-lyric');
    lyricTimer = setInterval(() => {
      lines[idx].classList.remove('active-lyric');
      idx = (idx + 1) % lines.length;
      lines[idx].classList.add('active-lyric');
    }, 2000);
  }
</script>
</body>
</html>
