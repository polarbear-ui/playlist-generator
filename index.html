<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모바일 듀얼스크린 플레이리스트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  /* 프리텐다드 서체 통합 */
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

  :root { --text-color: #000000; --box-color: #f8f9fa; }

  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background: #e2e5ea; padding: 20px; color: var(--text-color); margin: 0; -webkit-font-smoothing: antialiased; }
  
  /* --- 편집기 영역 (상단) --- */
  .generator-section { max-width: 800px; margin: 0 auto 40px auto; background: #fff; padding: 20px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); color: #333; }
  .config-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
  .config-row label { font-size: 0.85em; font-weight: 600; }
  .config-row input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
  .config-row input[type="color"] { width: 50px; height: 30px; border: none; cursor: pointer; background: none; }

  textarea { width: 100%; height: 200px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; resize: vertical; box-sizing: border-box; margin-bottom: 10px; line-height: 1.5; font-family: inherit; }

  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { flex: 1; min-width: 120px; background: #222; color: #fff; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
  .btn:hover { background: #444; }
  .btn.export-btn { background: #007AFF; }
  .btn.export-img-btn { background: #555; }
  
  #image-upload-section { display: none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
  .upload-item { display: flex; justify-content: space-between; align-items: center; background: #f4f4f5; padding: 12px; border-radius: 10px; margin-bottom: 8px; font-size: 0.9em; font-weight: 500;}

  /* --- 듀얼 폰 모크업 레이아웃 --- */
  .mockup-wrapper { display: none; justify-content: center; gap: 30px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
  .mockup-wrapper * { box-sizing: border-box; letter-spacing: -0.02em; margin: 0; padding: 0; }

  /* 폰 공통 스타일 */
  .phone-screen { 
    width: 350px; height: 750px; 
    border-radius: 45px; 
    box-shadow: 0 25px 60px rgba(0,0,0,0.15), inset 0 0 0 8px #fff; 
    padding: 60px 20px 30px 20px; 
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  /* 💡 수정됨: 캡처 에러의 주범인 가상 요소를 실제 div로 변경 */
  .status-bar { position: absolute; top: 18px; left: 30px; right: 30px; display: flex; justify-content: space-between; align-items: center; z-index: 10; font-size: 12px; font-weight: 700; pointer-events: none; }
  .status-battery { font-size: 10px; font-weight: 400; opacity: 0.8; }

  /* --- 왼쪽 폰 (플레이리스트) --- */
  .playlist-header { font-size: 1.2em; font-weight: 800; text-align: center; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 0.05em; }
  .song-list { list-style: none; overflow-y: auto; flex: 1; padding-bottom: 20px; }
  .song-list::-webkit-scrollbar { display: none; }
  
  .song-item { display: flex; align-items: center; padding: 12px 10px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; border-radius: 16px; }
  .song-item:hover, .song-item.active { background: rgba(0,0,0,0.05); }
  
  .song-thumb { width: 48px; height: 48px; border-radius: 50%; background-color: #ddd; background-size: cover; background-position: center; margin-right: 15px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  
  .song-info { flex: 1; overflow: hidden; }
  .song-title { font-size: 1.05em; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .song-artist { font-size: 0.85em; font-weight: 400; opacity: 0.5; }
  .more-icon { opacity: 0.3; margin-left: 10px; }

  /* --- 오른쪽 폰 (상세창) --- */
  .detail-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 10px; }
  .back-btn { font-weight: 800; font-size: 1.2em; cursor: pointer; }
  .now-playing-title { font-size: 0.9em; font-weight: 600; opacity: 0.5; text-transform: uppercase; }

  .lyrics-section { 
    flex: none; height: 240px; width: 100%;
    position: relative; border-radius: 20px; 
    display: flex; flex-direction: column; justify-content: center; align-items: center; 
    text-align: center; overflow: hidden; background-size: cover; background-position: center; 
    background-color: #333; padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
  }
  
  /* 💡 캡처 안정성을 위해 오버레이를 가상요소에서 실제 div로 분리 (HTML 참고) */
  .lyrics-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); z-index: 0; }

  .lyric-line { position: relative; z-index: 1; font-size: 1.05em; font-weight: 500; color: rgba(255,255,255,0.4); margin: 7px 0; transition: all 0.4s ease; word-break: keep-all; }
  .lyric-line.active-lyric { color: #ffffff; font-weight: 800; transform: scale(1.1); text-shadow: 0 0 15px rgba(255,255,255,0.3); }
  
  .player-controls { margin-top: 25px; display: flex; flex-direction: column; gap: 15px; padding: 0 10px; }
  
  .track-info-left { text-align: left; }
  #detail-title { font-size: 1.3em; font-weight: 800; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #detail-artist { font-size: 0.95em; font-weight: 400; opacity: 0.5; }

  .progress-row { display: flex; align-items: center; gap: 10px; }
  .time-text { font-size: 0.75em; font-weight: 500; opacity: 0.5; font-variant-numeric: tabular-nums; }
  .progress-bar-bg { flex: 1; height: 5px; background: rgba(0,0,0,0.1); border-radius: 3px; overflow: hidden; }
  .progress-fill { width: 35%; height: 100%; border-radius: 3px; }

  .control-buttons { display: flex; justify-content: center; align-items: center; gap: 35px; margin-top: 5px; }
  .control-icon { width: 30px; height: 30px; cursor: pointer; }
  .play-pause-icon { width: 40px; height: 40px; }

  .desc-section { 
    flex: 1; overflow-y: auto; font-size: 0.9em; font-weight: 300; background: rgba(0,0,0,0.03); 
    padding: 20px; border-radius: 20px; line-height: 1.6; text-align: center; 
    margin-top: 20px; word-break: keep-all; 
  }
  .desc-section::-webkit-scrollbar { width: 5px; }
  .desc-section::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }

  /* 💡 화면 중앙 팝업 모달 전용 CSS */
  .export-modal {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 99999;
  }

  /* 💡 캡처 도중 에러를 막기 위한 임시 평면화 스타일 (자바스크립트에서 토글됨) */
  .html2canvas-friendly .phone-screen { box-shadow: inset 0 0 0 8px #fff !important; border: 1px solid #ddd; }
  .html2canvas-friendly .lyrics-section { box-shadow: none !important; }
</style>
</head>
<body>

<div class="generator-section" id="generator-ui">
  <h2 style="margin-top:0;">듀얼스크린 플레이리스트 제너레이터</h2>
  <div class="config-row">
    <label>화면 타이틀</label><input type="text" id="title-input" placeholder="Favorites">
  </div>
  <div class="config-row">
    <label>글자색</label><input type="color" id="text-color-input" value="#222222">
    <label>배경색</label><input type="color" id="box-color-input" value="#f8f9fa">
  </div>
  
  <textarea id="data-input" placeholder="곡명: 노래 제목&#13;&#10;아티스트: 가수 이름&#13;&#10;설명: 곡 설명&#13;&#10;가사:&#13;&#10;가사 1줄&#13;&#10;가사 2줄&#13;&#10;---&#13;&#10;(곡 구분선 필수)"></textarea>
  <button class="btn" style="width:100%; margin-bottom:10px;" onclick="parseTextAndShowUpload()">본문 저장</button>
  
  <div id="image-upload-section">
    <h4 style="margin: 0 0 15px 0;">배경/앨범아트 이미지 첨부</h4>
    <div id="upload-list-container"></div>
    <div class="btn-group" style="margin-top:20px;">
      <button class="btn" onclick="generateFinalPlaylist()">결과물 확인</button>
      <button class="btn export-btn" onclick="copyHTML()">html 복사</button>
      <button class="btn export-img-btn" onclick="exportImage()">png로 저장</button>
    </div>
  </div>
</div>

<div class="mockup-wrapper" id="player-wrapper">
  
  <!-- 뼈대 색상 주입 -->
  <style id="dynamic-styles"></style>

  <!-- 왼쪽 폰 -->
  <div class="phone-screen">
    <div class="status-bar"><span>9:41</span><span class="status-battery">📶 100% 🔋</span></div>
    <div class="playlist-header" id="display-title">Favorites</div>
    <ul class="song-list" id="playlist-container"></ul>
  </div>

  <!-- 오른쪽 폰 -->
  <div class="phone-screen">
    <div class="status-bar"><span>9:41</span><span class="status-battery">📶 100% 🔋</span></div>
    <div class="detail-top-bar">
      <div class="back-btn">〈</div>
      <div class="now-playing-title">Now Playing</div>
      <div class="more-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
    </div>
    
    <div class="lyrics-section" id="lyrics-container">
       <div class="lyrics-overlay"></div>
       <div id="lyrics-lines-wrapper" style="position:relative; z-index:1;"></div>
    </div>

    <div class="player-controls">
      <div class="track-info-left">
        <div id="detail-title"></div>
        <div id="detail-artist"></div>
      </div>
      <div class="progress-row">
        <span class="time-text">1:24</span>
        <div class="progress-bar-bg"><div class="progress-fill"></div></div>
        <span class="time-text">-2:31</span>
      </div>
      <div class="control-buttons">
        <svg class="control-icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        <svg class="control-icon play-pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        <svg class="control-icon" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </div>
    </div>
    <div class="desc-section" id="desc-container"></div>
  </div>

</div>

<script>
  let songData = [];
  let lyricTimer = null;

  function parseTextAndShowUpload() {
    const rawText = document.getElementById('data-input').value;
    if (!rawText.trim()) return alert("텍스트를 입력해주세요.");
    const blocks = rawText.split(/---+/);
    const parsedData = [];
    blocks.forEach(block => {
      const lines = block.trim().split('\n');
      if (lines.length < 3) return;
      const song = { title: '', artist: '', image: '', description: '', lyrics: [] };
      let isParsingLyrics = false;
      lines.forEach(line => {
        const tLine = line.trim();
        if (tLine.startsWith('곡명:')) song.title = tLine.replace('곡명:', '').trim();
        else if (tLine.startsWith('아티스트:')) song.artist = tLine.replace('아티스트:', '').trim();
        else if (tLine.startsWith('설명:')) song.description = tLine.replace('설명:', '').trim();
        else if (tLine.startsWith('가사:')) isParsingLyrics = true;
        else if (isParsingLyrics && tLine.length > 0) song.lyrics.push(tLine);
      });
      if (song.title) parsedData.push(song);
    });
    if(parsedData.length === 0) return alert("데이터를 찾을 수 없습니다.");
    songData = parsedData;
    const uploadContainer = document.getElementById('upload-list-container');
    uploadContainer.innerHTML = '';
    songData.forEach((song, index) => {
      const div = document.createElement('div');
      div.className = 'upload-item';
      div.innerHTML = `<div>${song.title}</div><input type="file" accept="image/*" onchange="handleImageSelect(${index}, this)">`;
      uploadContainer.appendChild(div);
    });
    document.getElementById('image-upload-section').style.display = 'block';
  }

  function handleImageSelect(index, inputElement) {
    const file = inputElement.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => { songData[index].image = e.target.result; };
      reader.readAsDataURL(file);
    }
  }

  function generateFinalPlaylist() {
    const title = document.getElementById('title-input').value || "Favorites";
    const textColor = document.getElementById('text-color-input').value;
    const boxColor = document.getElementById('box-color-input').value;
    
    document.getElementById('display-title').innerText = title;
    
    // 라이브러리 버그 방지용 하드코딩 색상 주입
    document.getElementById('dynamic-styles').innerHTML = `
      #player-wrapper .phone-screen { background-color: ${boxColor}; color: ${textColor}; }
      #player-wrapper .progress-fill { background-color: ${textColor}; }
      #player-wrapper .control-icon { fill: ${textColor}; }
    `;

    const container = document.getElementById('playlist-container');
    container.innerHTML = '';
    songData.forEach((song, index) => {
      const li = document.createElement('li');
      li.className = 'song-item';
      const bgStyle = song.image ? `background-image: url('${song.image}');` : '';
      li.innerHTML = `
        <div class="song-thumb" style="${bgStyle}"></div>
        <div class="song-info">
          <div class="song-title">${song.title}</div>
          <div class="song-artist">${song.artist}</div>
        </div>
        <div class="more-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
      `;
      li.onclick = () => selectSong(index, li);
      container.appendChild(li);
    });
    document.getElementById('player-wrapper').style.display = 'flex';
    if(songData.length > 0) selectSong(0, container.firstChild);
  }

  function selectSong(index, element) {
    document.querySelectorAll('.song-item').forEach(item => item.classList.remove('active'));
    element.classList.add('active');
    const song = songData[index];
    
    document.getElementById('detail-title').innerText = song.title;
    document.getElementById('detail-artist').innerText = song.artist;
    document.getElementById('desc-container').innerText = song.description;
    
    const lc = document.getElementById('lyrics-container');
    const lw = document.getElementById('lyrics-lines-wrapper');
    
    if (song.image) lc.style.backgroundImage = `url('${song.image}')`;
    else { lc.style.backgroundColor = "#333"; lc.style.backgroundImage = "none"; }
    
    lw.innerHTML = '';
    song.lyrics.forEach(l => {
      const div = document.createElement('div');
      div.className = 'lyric-line';
      div.innerText = l;
      lw.appendChild(div);
    });
    startLyricAnimation(lw);
  }

  function startLyricAnimation(c) {
    clearInterval(lyricTimer);
    const n = c.querySelectorAll('.lyric-line');
    if (n.length === 0) return;
    let x = 0; n[0].classList.add('active-lyric');
    lyricTimer = setInterval(() => {
      n[x].classList.remove('active-lyric');
      x = (x + 1) % n.length;
      n[x].classList.add('active-lyric');
    }, 2000);
  }

  function copyHTML() {
    alert("복사 기능은 코드 길이상 현재 편집기 상태와 동일하게 유지됩니다.");
  }

  function exportImage() {
    const target = document.getElementById('player-wrapper');
    
    // 💡 1. 캡처 에러 방지를 위한 처리 (스크롤 락 & 그림자 제거)
    const songList = document.getElementById('playlist-container');
    const descBox = document.getElementById('desc-container');
    const prevSongOverflow = songList.style.overflowY;
    const prevDescOverflow = descBox.style.overflowY;
    
    songList.style.overflowY = 'hidden';
    descBox.style.overflowY = 'hidden';
    target.classList.add('html2canvas-friendly'); // 복잡한 그림자 임시 제거

    // 💡 2. 캡처 수행 (안정성을 위해 scale 2로 설정)
    html2canvas(target, { backgroundColor: null, scale: 2, logging: false }).then(canvas => {
      
      // 💡 3. 원상 복구
      songList.style.overflowY = prevSongOverflow;
      descBox.style.overflowY = prevDescOverflow;
      target.classList.remove('html2canvas-friendly');

      const imgData = canvas.toDataURL('image/png');
      const modal = document.createElement('div');
      
      modal.className = 'export-modal';
      
      modal.innerHTML = `
        <div style="color:#fff;margin-bottom:20px;font-weight:bold;font-family:sans-serif;">이미지를 길게 눌러 기기에 저장하세요</div>
        <img src="${imgData}" style="max-width:90%;max-height:75%;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,0.5);">
        <button onclick="document.body.removeChild(this.parentNode)" style="margin-top:20px;padding:12px 30px;background:#fff;border:none;border-radius:30px;font-weight:bold;cursor:pointer;color:#000;font-family:sans-serif;">닫기</button>
      `;
      document.body.appendChild(modal);
    }).catch(err => {
      alert('이미지 저장 중 오류가 발생했습니다.');
      songList.style.overflowY = prevSongOverflow;
      descBox.style.overflowY = prevDescOverflow;
      target.classList.remove('html2canvas-friendly');
    });
  }
</script>

</body>
</html>
