<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>듀얼스크린 플레이리스트 제너레이터 (미리보기/캡처 통합 픽스)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

  :root { --text-color: #222222; --box-color: #f8f9fa; }

  body { font-family: 'Pretendard', sans-serif; background: #eef1f5; padding: 20px; color: #333; margin: 0; }
  
  /* 제너레이터 UI */
  .generator-section { max-width: 800px; margin: 0 auto 40px auto; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  .config-row { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
  .config-row label { font-size: 0.9em; font-weight: 700; width: 80px; }
  .config-row input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
  .config-row input[type="color"] { width: 50px; height: 35px; border: none; cursor: pointer; background: none; }

  textarea { width: 100%; height: 180px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; resize: vertical; margin-bottom: 10px; line-height: 1.5; font-family: inherit; }

  .btn { background: #222; color: #fff; border: none; padding: 14px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
  .btn:hover { background: #444; }
  .btn.blue { background: #007AFF; }
  .btn.gray { background: #666; }
  
  #image-upload-section { display: none; margin-top: 20px; border-top: 2px solid #f4f4f4; padding-top: 20px; }
  .upload-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px 15px; border-radius: 12px; margin-bottom: 10px; font-size: 0.9em; }

  /* 캡처/미리보기 대상 영역 */
  #capture-area { background: #ffffff; padding: 60px 40px; border-radius: 20px; display: none; justify-content: center; }

  /* 듀얼 폰 모크업 */
  .mockup-wrapper { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; width: 100%; max-width: 1000px; }
  
  /* 💡 픽스: 고정 높이 안에서 요소들이 싸우지 않게 flex 레이아웃 강화 */
  .phone-screen { 
    width: 350px; height: 750px; background: var(--box-color); border-radius: 50px; 
    box-shadow: 0 30px 60px rgba(0,0,0,0.12), inset 0 0 0 10px #ffffff; 
    padding: 60px 25px 30px 25px; display: flex; flex-direction: column; position: relative; overflow: hidden; 
    color: var(--text-color); box-sizing: border-box;
  }

  .status-bar { position: absolute; top: 22px; left: 35px; right: 35px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; opacity: 0.8; }
  .playlist-header { font-size: 1.3em; font-weight: 900; text-align: center; margin-bottom: 30px; letter-spacing: 0.05em; flex-shrink: 0;}
  
  .song-list { list-style: none; flex: 1; overflow-y: auto; padding: 0; margin: 0; }
  .song-list::-webkit-scrollbar { display: none; }
  .song-item { display: flex; align-items: center; padding: 12px; margin-bottom: 8px; border-radius: 18px; cursor: pointer; transition: 0.2s; }
  .song-item.active { background: rgba(0,0,0,0.06); }
  .song-thumb { width: 50px; height: 50px; border-radius: 50%; background: #ddd; background-size: cover; background-position: center; margin-right: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex-shrink: 0; }
  .song-info { flex: 1; overflow: hidden; }
  .song-title { font-weight: 800; font-size: 1.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;}
  .song-artist { font-size: 0.85em; opacity: 0.5; }

  /* 오른쪽 상세 화면 픽스 */
  
  /* 💡 픽스: 가사창 높이를 고정하고 내부 스크롤 허용하여 배경 이미지 잘림 방지 */
  .lyrics-section { 
    height: 250px; width: 100%; position: relative; border-radius: 25px; 
    overflow: hidden; background-color: #333; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; flex-shrink: 0;
  }
  .lyrics-real-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .lyrics-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); z-index: 1; }
  
  /* 💡 픽스: 가사가 길어지면 상자 안에서 스크롤되게 함 */
  #view-lyric-lines { 
    position: relative; z-index: 2; width: 100%; max-height: 100%; 
    overflow-y: auto; padding-right: 5px; /* 스크롤바 공간 */
  }
  #view-lyric-lines::-webkit-scrollbar { display: none; } /* 스크롤바 숨김 */
  
  .lyric-line { font-size: 1.05em; color: rgba(255,255,255,0.4); margin: 6px 0; transition: 0.4s; word-break: keep-all; font-weight: 500;}
  .lyric-line.active-lyric { color: #fff; font-weight: 800; transform: scale(1.1); text-shadow: 0 0 10px rgba(0,0,0,0.5); }

  /* 💡 픽스: 플레이어 컨트롤러 공간 확보 (압축 방지) */
  .player-controls { margin-top: 30px; padding: 0 10px; flex-shrink: 0; }
  .track-meta { margin-bottom: 20px; }
  .track-meta h4 { font-size: 1.4em; font-weight: 900; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-meta p { opacity: 0.5; font-size: 0.95em; margin: 0; }

  .progress-bar { height: 6px; background: rgba(0,0,0,0.1); border-radius: 10px; margin: 20px 0; position: relative; }
  .progress-fill { width: 35%; height: 100%; background: var(--text-color); border-radius: 10px; }
  .control-btns { display: flex; justify-content: center; align-items: center; gap: 30px; font-size: 24px; color: var(--text-color); opacity: 0.9; margin-top: 10px; }
  .play-btn { font-size: 34px; }

  /* 💡 픽스: 설명 박스 높이를 고정하고 컨트롤러를 밀어내지 않게 함 */
  .desc-box { 
    height: 150px; margin-top: 20px; padding: 20px; background: rgba(0,0,0,0.03); 
    border-radius: 20px; font-size: 0.9em; line-height: 1.6; text-align: center; 
    word-break: keep-all; overflow-y: auto; box-sizing: border-box; flex-shrink: 0; 
  }
  .desc-box::-webkit-scrollbar { display: none; }

  @media (max-width: 768px) {
    #capture-area { padding: 30px 10px; }
    .phone-screen { width: 100%; max-width: 350px; height: auto; min-height: 700px; border-radius: 35px; }
    .status-bar { display: none; }
  }
</style>
</head>
<body>

<div class="generator-section" id="gen-ui">
  <h2 style="margin-top:0; margin-bottom:25px;">플레이리스트 제너레이터</h2>
  <div class="config-row">
    <label>타이틀</label><input type="text" id="title-in" value="Favorites">
  </div>
  <div class="config-row">
    <label>글자색</label><input type="color" id="t-color" value="#111111">
    <label>배경색</label><input type="color" id="b-color" value="#ffffff">
  </div>
  <textarea id="data-in" placeholder="곡명: 노래 제목&#13;&#10;아티스트: 가수 이름&#13;&#10;설명: 곡 설명&#13;&#10;가사:&#13;&#10;가사 한줄씩 입력&#13;&#10;---"></textarea>
  <button class="btn" style="width:100%" onclick="initStep1()">본문 저장</button>

  <div id="image-upload-section">
    <div id="upload-list"></div>
    <div class="config-row" style="margin-top:20px;">
      <button class="btn blue" style="flex:2" onclick="renderPreview()">결과물 확인</button>
      <button class="btn gray" style="flex:1" onclick="exportToImage()">이미지 저장</button>
    </div>
  </div>
</div>

<!-- 이미지 캡처/미리보기 대상 영역 -->
<div id="capture-area">
  <div class="mockup-wrapper" id="preview-wrapper">
    <!-- 왼쪽 폰 -->
    <div class="phone-screen">
      <div class="status-bar"><span>9:41</span><span>📶 100% 🔋</span></div>
      <div class="playlist-header" id="view-title">Favorites</div>
      <ul class="song-list" id="view-list"></ul>
    </div>
    <!-- 오른쪽 폰 -->
    <div class="phone-screen">
      <div class="status-bar"><span>9:41</span><span>📶 100% 🔋</span></div>
      
      <div class="lyrics-section">
        <img id="view-lyric-bg" class="lyrics-real-bg" src="" style="display:none;" />
        <div class="lyrics-overlay"></div>
        <!-- 💡 픽스: 내부 스크롤 허용 -->
        <div id="view-lyric-lines"></div>
      </div>

      <div class="player-controls">
        <div class="track-meta">
          <h4 id="view-song-title">곡 제목</h4>
          <p id="view-artist">아티스트</p>
        </div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <div class="control-btns">
          <span>⏮</span>
          <span class="play-btn">⏸</span>
          <span>⏭</span>
        </div>
      </div>
      <div class="desc-box" id="view-desc"></div>
    </div>
  </div>
</div>

<script>
  let songs = [];
  let timer = null;

  function initStep1() {
    const raw = document.getElementById('data-in').value;
    const blocks = raw.split(/---+/);
    songs = [];
    blocks.forEach(b => {
      const lines = b.trim().split('\n');
      if (lines.length < 2) return;
      let s = { title: '', artist: '', desc: '', lyrics: [], img: '' };
      let isL = false;
      lines.forEach(l => {
        if (l.startsWith('곡명:')) s.title = l.replace('곡명:', '').trim();
        else if (l.startsWith('아티스트:')) s.artist = l.replace('아티스트:', '').trim();
        else if (l.startsWith('설명:')) s.desc = l.replace('설명:', '').trim();
        else if (l.startsWith('가사:')) isL = true;
        else if (isL && l.trim()) s.lyrics.push(l.trim());
      });
      if (s.title) songs.push(s);
    });

    if(songs.length === 0) return alert("데이터를 찾을 수 없습니다.");

    const upList = document.getElementById('upload-list');
    upList.innerHTML = '<h4 style="margin:0 0 10px 0;">이미지 첨부</h4>';
    songs.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = 'upload-item';
      d.innerHTML = `<span style="font-weight:700;">${s.title}</span><input type="file" accept="image/*" onchange="loadImg(${i}, this)">`;
      upList.appendChild(d);
    });
    document.getElementById('image-upload-section').style.display = 'block';
  }

  function loadImg(idx, input) {
    if (input.files[0]) {
      const r = new FileReader();
      r.onload = e => { songs[idx].img = e.target.result; };
      r.readAsDataURL(input.files[0]);
    }
  }

  function renderPreview() {
    document.documentElement.style.setProperty('--text-color', document.getElementById('t-color').value);
    document.documentElement.style.setProperty('--box-color', document.getElementById('b-color').value);
    document.getElementById('view-title').innerText = document.getElementById('title-in').value || "Favorites";
    
    const list = document.getElementById('view-list');
    list.innerHTML = '';
    songs.forEach((s, i) => {
      const li = document.createElement('li');
      li.className = 'song-item' + (i === 0 ? ' active' : '');
      const thumbStyle = s.img ? `background-image:url('${s.img}')` : '';
      li.innerHTML = `<div class="song-thumb" style="${thumbStyle}"></div><div class="song-info"><div class="song-title">${s.title}</div><div class="song-artist">${s.artist}</div></div>`;
      li.onclick = () => select(i, li);
      list.appendChild(li);
    });
    
    document.getElementById('capture-area').style.display = 'flex';
    if (songs.length > 0) select(0, list.firstChild);
  }

  function select(idx, el) {
    document.querySelectorAll('.song-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    
    const s = songs[idx];
    document.getElementById('view-song-title').innerText = s.title;
    document.getElementById('view-artist').innerText = s.artist;
    document.getElementById('view-desc').innerText = s.desc;
    
    const bgImg = document.getElementById('view-lyric-bg');
    if(s.img) {
      bgImg.src = s.img;
      bgImg.style.display = 'block';
    } else {
      bgImg.style.display = 'none';
      bgImg.src = '';
    }
    
    const lw = document.getElementById('view-lyric-lines');
    lw.innerHTML = '';
    s.lyrics.forEach((l, i) => {
      const d = document.createElement('div');
      d.className = 'lyric-line' + (i === 0 ? ' active-lyric' : '');
      d.innerText = l;
      lw.appendChild(d);
    });
    
    // 💡 미리보기 화면에서도 스크롤이 자동으로 되도록 처리 (선택사항)
    lw.scrollTop = 0; 

    clearInterval(timer);
    let lIdx = 0;
    const lines = lw.querySelectorAll('.lyric-line');
    if (lines.length > 1) {
      timer = setInterval(() => {
        lines[lIdx].classList.remove('active-lyric');
        lIdx = (lIdx + 1) % lines.length;
        lines[lIdx].classList.add('active-lyric');
        
        // 활성화된 가사로 자동 스크롤
        const targetLine = lines[lIdx];
        lw.scrollTo({
          top: targetLine.offsetTop - lw.offsetHeight / 2 + targetLine.offsetHeight / 2,
          behavior: 'smooth'
        });
      }, 2500);
    }
  }

  async function exportToImage() {
    const target = document.getElementById('capture-area');
    window.scrollTo(0, 0); 

    try {
      // 💡 캡처 시에는 데이터를 안정적으로 뽑기 위해 애니메이션 일시 중지 및 스크롤 리셋
      clearInterval(timer);
      document.getElementById('view-lyric-lines').scrollTop = 0;

      const dataUrl = await htmlToImage.toPng(target, {
        quality: 1.0,
        backgroundColor: '#ffffff',
        pixelRatio: 2 // 선명도를 위해 2배수로 캡처
      });
      
      const link = document.createElement('a');
      link.download = 'playlist-dual-screen.png';
      link.href = dataUrl;
      link.click();
      
      // 캡처 후 애니메이션 다시 시작
      renderPreview(); 
    } catch (error) {
      alert('이미지 생성 중 오류가 발생했습니다.');
      console.error(error);
    }
  }
</script>
</body>
</html>
