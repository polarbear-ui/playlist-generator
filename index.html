<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>듀얼스크린 플레이리스트 제너레이터 (오리지널 디자인 완벽 복원)</title>
<!-- 안 깨지는 이미지 저장을 위한 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

  :root { --text-color: #000000; --box-color: #f8f9fa; }

  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background: #e2e5ea; padding: 20px; color: var(--text-color); margin: 0; -webkit-font-smoothing: antialiased; }
  
  /* --- 편집기 영역 --- */
  .generator-section { max-width: 800px; margin: 0 auto 40px auto; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); color: #333; }
  .config-row { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
  .config-row label { font-size: 0.9em; font-weight: 700; width: 80px; }
  .config-row input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
  .config-row input[type="color"] { width: 50px; height: 35px; border: none; cursor: pointer; background: none; }

  textarea { width: 100%; height: 180px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; resize: vertical; margin-bottom: 10px; line-height: 1.5; font-family: inherit; }

  .btn { background: #222; color: #fff; border: none; padding: 14px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
  .btn:hover { background: #444; }
  .btn.blue { background: #007AFF; }
  .btn.gray { background: #666; }
  .btn.green { background: #28a745; }
  
  #image-upload-section { display: none; margin-top: 20px; border-top: 2px solid #f4f4f4; padding-top: 20px; }
  .upload-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px 15px; border-radius: 12px; margin-bottom: 10px; font-size: 0.9em; font-weight: 500; }

  /* 캡처를 위해 여백과 흰 배경을 주는 영역 */
  #capture-area { background: #ffffff; padding: 60px 40px; border-radius: 20px; display: none; justify-content: center; }

  /* --- 듀얼 폰 모크업 레이아웃 (오리지널 비율과 디자인) --- */
  .mockup-wrapper { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; width: 100%; max-width: 1000px; margin: 0 auto; }
  .mockup-wrapper * { box-sizing: border-box; letter-spacing: -0.02em; margin: 0; padding: 0; }

  .phone-screen { 
    width: 350px; height: 750px; 
    background: var(--box-color); 
    border-radius: 45px; 
    box-shadow: 0 25px 60px rgba(0,0,0,0.15), inset 0 0 0 8px #fff; 
    padding: 60px 20px 30px 20px; 
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  .status-bar { position: absolute; top: 18px; left: 30px; right: 30px; display: flex; justify-content: space-between; align-items: center; z-index: 10; font-size: 12px; font-weight: 700; pointer-events: none; }
  .status-battery { font-size: 10px; font-weight: 400; opacity: 0.8; }

  /* 왼쪽 폰 */
  .playlist-header { font-size: 1.2em; font-weight: 800; text-align: center; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
  .song-list { list-style: none; overflow-y: auto; flex: 1; padding-bottom: 20px; }
  .song-list::-webkit-scrollbar { display: none; }
  
  .song-item { display: flex; align-items: center; padding: 12px 10px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; border-radius: 16px; }
  .song-item:hover, .song-item.active { background: rgba(0,0,0,0.05); }
  
  .song-thumb { width: 48px; height: 48px; border-radius: 50%; background-color: #ddd; background-size: cover; background-position: center; margin-right: 15px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  
  .song-info { flex: 1; overflow: hidden; }
  .song-title { font-size: 1.05em; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .song-artist { font-size: 0.85em; font-weight: 400; opacity: 0.5; }
  .more-icon { opacity: 0.3; margin-left: 10px; display: flex; align-items: center; }

  /* 오른쪽 폰 (오리지널 디자인 복원) */
  .detail-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 10px; }
  .back-btn { font-weight: 800; font-size: 1.2em; cursor: pointer; }
  .now-playing-title { font-size: 0.9em; font-weight: 600; opacity: 0.5; text-transform: uppercase; }

  /* 오리지널 240px 비율 가사창 */
  .lyrics-section { 
    flex: none; height: 240px; width: 100%;
    position: relative; border-radius: 20px; 
    display: flex; flex-direction: column; justify-content: center; align-items: center; 
    text-align: center; overflow: hidden; background-color: #333; padding: 20px; 
    box-shadow: 0 15px 35px rgba(0,0,0,0.1); box-sizing: border-box;
  }
  
  /* 💡 이미지 캡처 시 잘림 방지를 위한 투명 img 태그 픽스 (이것만 유지) */
  .lyrics-real-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .lyrics-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); z-index: 1; }
  
  #view-lyric-lines { position: relative; z-index: 2; width: 100%; }

  /* 오리지널 하이라이트 애니메이션 복원 */
  .lyric-line { font-size: 1.05em; font-weight: 500; color: rgba(255,255,255,0.4); margin: 7px 0; transition: all 0.4s ease; word-break: keep-all; }
  .lyric-line.active-lyric { color: #ffffff; font-weight: 800; transform: scale(1.1); text-shadow: 0 0 15px rgba(255,255,255,0.3); }
  
  .player-controls { margin-top: 25px; display: flex; flex-direction: column; gap: 15px; padding: 0 10px; flex-shrink: 0; }
  .track-info-left { text-align: left; }
  #view-song-title { font-size: 1.3em; font-weight: 800; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #view-artist { font-size: 0.95em; font-weight: 400; opacity: 0.5; }

  /* 오리지널 진행바 (시간 표시 포함) */
  .progress-row { display: flex; align-items: center; gap: 10px; }
  .time-text { font-size: 0.75em; font-weight: 500; opacity: 0.5; font-variant-numeric: tabular-nums; }
  .progress-bar-bg { flex: 1; height: 5px; background: rgba(0,0,0,0.1); border-radius: 3px; overflow: hidden; }
  .progress-fill { width: 35%; height: 100%; background-color: var(--text-color); border-radius: 3px; }

  /* 오리지널 SVG 컨트롤 아이콘 */
  .control-buttons { display: flex; justify-content: center; align-items: center; gap: 35px; margin-top: 5px; }
  .control-icon { width: 30px; height: 30px; fill: var(--text-color); cursor: pointer; }
  .play-pause-icon { width: 40px; height: 40px; }

  .desc-section { 
    flex: 1; overflow-y: auto; font-size: 0.9em; font-weight: 300; background: rgba(0,0,0,0.03); 
    padding: 20px; border-radius: 20px; line-height: 1.6; text-align: center; 
    margin-top: 20px; word-break: keep-all; box-sizing: border-box;
  }
  .desc-section::-webkit-scrollbar { display: none; }

  @media (max-width: 768px) {
    #capture-area { padding: 30px 10px; }
    .phone-screen { width: 100%; max-width: 350px; height: auto; min-height: 700px; border-radius: 35px; }
    .status-bar { display: none; }
  }
  /* 모바일 색상 선택기 픽스 (확인 버튼 증발 방지) */
  .color-picker-wrap { display: flex; gap: 20px; }
  .color-box { display: flex; align-items: center; gap: 8px; }
  .color-box label { width: auto; margin: 0; }
  .color-box input[type="color"] { width: 40px; height: 40px; padding: 0; border: none; background: transparent; cursor: pointer; }
  .color-box input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .color-box input[type="color"]::-webkit-color-swatch { border: 1px solid #ccc; border-radius: 6px; }

  /* 모바일 캡처 시 강제 듀얼 레이아웃(PC화면) 유지 픽스 */
  .is-capturing #capture-area { width: 850px !important; max-width: none !important; padding: 60px 40px !important; }
  .is-capturing .mockup-wrapper { flex-wrap: nowrap !important; }
  .is-capturing .phone-screen { width: 350px !important; max-width: 350px !important; min-height: 750px !important; border-radius: 45px !important; }
  .is-capturing .status-bar { display: flex !important; }
</style>
</head>
<body>

<div class="generator-section" id="gen-ui">
  <h2 style="margin-top:0; margin-bottom:25px;">플레이리스트 제너레이터</h2>
  <div class="config-row">
    <label>타이틀</label><input type="text" id="title-in" value="Favorites">
  </div>
  <div class="config-row">
    <div class="config-row color-picker-wrap">
    <div class="color-box"><label>글자색</label><input type="color" id="t-color" value="#222222"></div>
    <div class="color-box"><label>배경색</label><input type="color" id="b-color" value="#f8f9fa"></div>
  </div>
  <textarea id="data-in" placeholder="곡명: 노래 제목&#13;&#10;아티스트: 가수 이름&#13;&#10;설명: 곡 설명&#13;&#10;가사:&#13;&#10;가사 한줄씩 입력&#13;&#10;---"></textarea>
  <button class="btn" style="width:100%" onclick="initStep1()">본문 저장</button>

  <div id="image-upload-section">
    <div id="upload-list"></div>
    <div class="config-row" style="margin-top:20px;">
      <button class="btn blue" style="flex:2" onclick="renderPreview()">결과물 확인</button>
      <button class="btn gray" style="flex:1" onclick="exportToImage()">이미지로 저장</button>
      <button class="btn green" style="flex:1" onclick="exportToStandaloneHTML()">웹 파일로 백업 (.html)</button>
    </div>
  </div>
</div>

<div id="capture-area">
  <div class="mockup-wrapper" id="preview-wrapper">
    <!-- 왼쪽 폰 -->
    <div class="phone-screen">
      <div class="status-bar"><span>9:41</span><span class="status-battery">📶 100% 🔋</span></div>
      <div class="playlist-header" id="view-title">Favorites</div>
      <ul class="song-list" id="view-list"></ul>
    </div>

    <!-- 오른쪽 폰 -->
    <div class="phone-screen">
      <div class="status-bar"><span>9:41</span><span class="status-battery">📶 100% 🔋</span></div>
      
      <!-- 오리지널 상단 바 -->
      <div class="detail-top-bar">
        <div class="back-btn">〈</div>
        <div class="now-playing-title">NOW PLAYING</div>
        <div class="more-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>
      </div>
      
      <!-- 오리지널 가사창 -->
      <div class="lyrics-section">
        <img id="view-lyric-bg" class="lyrics-real-bg" src="" style="display:none;" />
        <div class="lyrics-overlay"></div>
        <div id="view-lyric-lines"></div>
      </div>

      <!-- 오리지널 컨트롤러 (진행 시간 및 SVG 아이콘) -->
      <div class="player-controls">
        <div class="track-info-left">
          <div id="view-song-title">곡 제목</div>
          <div id="view-artist">아티스트</div>
        </div>
        
        <div class="progress-row">
          <span class="time-text">1:24</span>
          <div class="progress-bar-bg"><div class="progress-fill"></div></div>
          <span class="time-text">-2:31</span>
        </div>
        
        <div class="control-buttons">
          <svg class="control-icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          <svg class="control-icon play-pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          <svg class="control-icon" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </div>
      </div>
      
      <!-- 오리지널 설명창 -->
      <div class="desc-section" id="view-desc"></div>
    </div>
  </div>
</div>

<script>
  let songs = [];
  let timer = null;

  function initStep1() {
    const raw = document.getElementById('data-in').value;
    const blocks = raw.split(/---+/);
    songs = [];
    blocks.forEach(b => {
      const lines = b.trim().split('\n');
      if (lines.length < 2) return;
      let s = { title: '', artist: '', desc: '', lyrics: [], img: '' };
      let isL = false;
      lines.forEach(l => {
        if (l.startsWith('곡명:')) s.title = l.replace('곡명:', '').trim();
        else if (l.startsWith('아티스트:')) s.artist = l.replace('아티스트:', '').trim();
        else if (l.startsWith('설명:')) s.desc = l.replace('설명:', '').trim();
        else if (l.startsWith('가사:')) isL = true;
        else if (isL && l.trim()) s.lyrics.push(l.trim());
      });
      if (s.title) songs.push(s);
    });

    if(songs.length === 0) return alert("데이터를 찾을 수 없습니다.");

    const upList = document.getElementById('upload-list');
    upList.innerHTML = '<h4 style="margin:0 0 10px 0;">이미지 첨부</h4>';
    songs.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = 'upload-item';
      d.innerHTML = `<span style="font-weight:700;">${s.title}</span><input type="file" accept="image/*" onchange="loadImg(${i}, this)">`;
      upList.appendChild(d);
    });
    document.getElementById('image-upload-section').style.display = 'block';
  }

  function loadImg(idx, input) {
    if (input.files[0]) {
      const r = new FileReader();
      r.onload = e => { songs[idx].img = e.target.result; };
      r.readAsDataURL(input.files[0]);
    }
  }

  function renderPreview() {
    document.documentElement.style.setProperty('--text-color', document.getElementById('t-color').value);
    document.documentElement.style.setProperty('--box-color', document.getElementById('b-color').value);
    document.getElementById('view-title').innerText = document.getElementById('title-in').value || "Favorites";
    
    const list = document.getElementById('view-list');
    list.innerHTML = '';
    songs.forEach((s, i) => {
      const li = document.createElement('li');
      li.className = 'song-item' + (i === 0 ? ' active' : '');
      const thumbStyle = s.img ? `background-image:url('${s.img}')` : '';
      li.innerHTML = `
        <div class="song-thumb" style="${thumbStyle}"></div>
        <div class="song-info">
          <div class="song-title">${s.title}</div>
          <div class="song-artist">${s.artist}</div>
        </div>
        <div class="more-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
      `;
      li.onclick = () => select(i, li);
      list.appendChild(li);
    });
    
    document.getElementById('capture-area').style.display = 'flex';
    if (songs.length > 0) select(0, list.firstChild);
  }

  function select(idx, el) {
    document.querySelectorAll('.song-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    
    const s = songs[idx];
    document.getElementById('view-song-title').innerText = s.title;
    document.getElementById('view-artist').innerText = s.artist;
    document.getElementById('view-desc').innerText = s.desc;
    
    // 안전한 이미지 바인딩 (이 기능 덕분에 이미지 저장 시 잘리지 않습니다)
    const bgImg = document.getElementById('view-lyric-bg');
    if(s.img) {
      bgImg.src = s.img;
      bgImg.style.display = 'block';
    } else {
      bgImg.style.display = 'none';
      bgImg.src = '';
    }
    
    const lw = document.getElementById('view-lyric-lines');
    lw.innerHTML = '';
    s.lyrics.forEach((l, i) => {
      const d = document.createElement('div');
      d.className = 'lyric-line' + (i === 0 ? ' active-lyric' : '');
      d.innerText = l;
      lw.appendChild(d);
    });
    
    clearInterval(timer);
    let lIdx = 0;
    const lines = lw.querySelectorAll('.lyric-line');
    
    if (lines.length > 1) {
      timer = setInterval(() => {
        lines[lIdx].classList.remove('active-lyric');
        lIdx = (lIdx + 1) % lines.length;
        lines[lIdx].classList.add('active-lyric');
      }, 2000); // 원본 시간 2000ms 복구
    }
  }

  async function exportToImage() {
    const target = document.getElementById('capture-area');
    window.scrollTo(0, 0); 

    // 💡 모바일 캡처 시 강제로 PC(듀얼) 레이아웃으로 변경하는 클래스 추가
    document.body.classList.add('is-capturing');

    try {
      clearInterval(timer);
      
      // 브라우저가 PC 레이아웃으로 변신할 시간을 아주 짧게(0.1초) 줍니다
      await new Promise(resolve => setTimeout(resolve, 100));

      const dataUrl = await htmlToImage.toPng(target, {
        quality: 1.0, backgroundColor: '#ffffff', pixelRatio: 2 
      });
      
      const link = document.createElement('a');
      link.download = 'playlist_dual_screen.png';
      link.href = dataUrl;
      link.click();
      
      // 💡 캡처 완료 후 원래 모바일 화면으로 감쪽같이 복구
      document.body.classList.remove('is-capturing');
      renderPreview();
    } catch (error) {
      alert('이미지 생성 중 오류가 발생했습니다.');
      document.body.classList.remove('is-capturing');
      console.error(error);
    }
  }
  // 💡 백업용 독립 웹페이지 파일 생성 및 다운로드 기능
  function exportToStandaloneHTML() {
    if(songs.length === 0) return alert("데이터를 먼저 입력해주세요.");

    const title = document.getElementById('title-in').value || "Favorites";
    const tCol = document.getElementById('t-color').value;
    const bCol = document.getElementById('b-color').value;

    // 뷰어의 코드를 모두 쓸어담아 스스로 작동하는 하나의 완전한 HTML을 만듭니다.
    const standaloneHTML = `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${title}</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
  :root { --text-color: ${tCol}; --box-color: ${bCol}; }
  body { font-family: 'Pretendard', sans-serif; background: #e2e5ea; padding: 40px 20px; color: var(--text-color); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  
  .mockup-wrapper { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; width: 100%; max-width: 1000px; margin: 0 auto; }
  .mockup-wrapper * { box-sizing: border-box; letter-spacing: -0.02em; margin: 0; padding: 0; }
  .phone-screen { width: 350px; height: 750px; background: var(--box-color); border-radius: 45px; box-shadow: 0 25px 60px rgba(0,0,0,0.15), inset 0 0 0 8px #fff; padding: 60px 20px 30px 20px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .status-bar { position: absolute; top: 18px; left: 30px; right: 30px; display: flex; justify-content: space-between; align-items: center; z-index: 10; font-size: 12px; font-weight: 700; pointer-events: none; }
  .status-battery { font-size: 10px; font-weight: 400; opacity: 0.8; }
  .playlist-header { font-size: 1.2em; font-weight: 800; text-align: center; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
  .song-list { list-style: none; overflow-y: auto; flex: 1; padding-bottom: 20px; }
  .song-list::-webkit-scrollbar { display: none; }
  .song-item { display: flex; align-items: center; padding: 12px 10px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; border-radius: 16px; }
  .song-item:hover, .song-item.active { background: rgba(0,0,0,0.05); }
  .song-thumb { width: 48px; height: 48px; border-radius: 50%; background-color: #ddd; background-size: cover; background-position: center; margin-right: 15px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  .song-info { flex: 1; overflow: hidden; }

<script>
  const songs = ${JSON.stringify(songs)};
  let timer = null;

  function initPlaylist() {
    const list = document.getElementById('view-list');
    songs.forEach((s, i) => {
      const li = document.createElement('li');
      li.className = 'song-item' + (i === 0 ? ' active' : '');
      const thumbStyle = s.img ? "background-image:url('" + s.img + "')" : "";
      li.innerHTML = '<div class="song-thumb" style="' + thumbStyle + '"></div>' +
                     '<div class="song-info">' +
                       '<div class="song-title">' + s.title + '</div>' +
                       '<div class="song-artist">' + s.artist + '</div>' +
                     '</div>' +
                     '<div class="more-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>';
      li.onclick = () => selectSong(i, li);
      list.appendChild(li);
    });
    if (songs.length > 0) selectSong(0, list.firstChild);
  }

  function selectSong(idx, el) {
    document.querySelectorAll('.song-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    
    const s = songs[idx];
    document.getElementById('view-song-title').innerText = s.title;
    document.getElementById('view-artist').innerText = s.artist;
    document.getElementById('view-desc').innerText = s.desc;
    
    const bgImg = document.getElementById('view-lyric-bg');
    if(s.img) {
      bgImg.src = s.img;
      bgImg.style.display = 'block';
    } else {
      bgImg.style.display = 'none';
      bgImg.src = '';
    }
    
    const lw = document.getElementById('view-lyric-lines');
    lw.innerHTML = '';
    s.lyrics.forEach((l, i) => {
      const d = document.createElement('div');
      d.className = 'lyric-line' + (i === 0 ? ' active-lyric' : '');
      d.innerText = l;
      lw.appendChild(d);
    });
    
    clearInterval(timer);
    let lIdx = 0;
    const lines = lw.querySelectorAll('.lyric-line');
    
    if (lines.length > 1) {
      timer = setInterval(() => {
        lines[lIdx].classList.remove('active-lyric');
        lIdx = (lIdx + 1) % lines.length;
        lines[lIdx].classList.add('active-lyric');
      }, 2000); 
    }
  }

  initPlaylist();
<\/script>
