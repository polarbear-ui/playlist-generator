<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  /* 프리텐다드 통합 서체 (모든 굵기 지원) */
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

  :root { --text-color: #000000; --box-color: #eef2f6; }

  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background: #f4f7f6; padding: 20px; color: var(--text-color); margin: 0; -webkit-font-smoothing: antialiased; }
  
  .main-layout { display: flex; gap: 30px; max-width: 1000px; margin: 0 auto; align-items: flex-start; justify-content: center; }

  /* 편집기 영역 */
  .generator-section { flex: 1; max-width: 500px; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); color: #333; }
  .config-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
  .config-row label { font-size: 0.85em; font-weight: 600; }
  .config-row input[type="text"] { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
  .config-row input[type="color"] { width: 50px; height: 30px; border: none; cursor: pointer; background: none; }

  textarea { width: 100%; height: 250px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; resize: vertical; box-sizing: border-box; margin-bottom: 10px; line-height: 1.5; font-family: inherit; }

  .btn { width: 100%; background: #222; color: #fff; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 10px; font-size: 14px; transition: 0.2s; }
  .btn:hover { background: #444; }
  .btn.export-btn { background: #007AFF; } /* 애플 블루 */
  .btn.export-img-btn { background: #555; }

  #image-upload-section { display: none; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
  .upload-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.9em; }
  
  .export-actions { display: none; gap: 10px; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }

  /* 플레이어 영역 */
  .player-wrapper { display: none; flex-direction: column; width: 100%; max-width: 400px; gap: 15px; margin: 0 auto; }
  .player-wrapper * { box-sizing: border-box; letter-spacing: -0.02em; }

  .panel { background: var(--box-color); border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
  
  /* 제목 및 곡 정보: Pretendard 굵게 적용 */
  .playlist-header { font-size: 1.4em; font-weight: 800; margin-bottom: 20px; }
  .song-list { list-style: none; padding: 0; margin: 0; }
  .song-item { display: flex; align-items: center; background: rgba(255,255,255,0.6); border-radius: 16px; margin-bottom: 12px; padding: 14px; cursor: pointer; transition: 0.2s; }
  .song-item.active { background: #fff; transform: scale(1.02); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  
  .play-icon { width: 32px; height: 32px; flex-shrink: 0; background: var(--text-color); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 14px; font-size: 10px; }
  
  .song-info { flex: 1; overflow: hidden; }
  .song-title { font-size: 1em; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .song-artist { font-size: 0.85em; font-weight: 400; opacity: 0.6; }

  .more-icon { display: flex; align-items: center; opacity: 0.3; margin-left: 10px; }

  .details-panel { display: flex; flex-direction: column; gap: 15px; }
  .details-header { font-size: 1.1em; font-weight: 700; margin-bottom: 5px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 10px; }
  
  .lyrics-section { position: relative; border-radius: 18px; min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; overflow: hidden; background-size: cover; background-position: center; box-shadow: inset 0 0 0 2000px rgba(0,0,0,0.55); padding: 20px; }
  .lyric-line { font-size: 1.05em; font-weight: 500; color: rgba(255,255,255,0.5); margin: 6px 0; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; word-break: keep-all; }
  .lyric-line.active-lyric { color: #ffffff; font-weight: 800; transform: scale(1.1); text-shadow: 0 0 15px rgba(255,255,255,0.3); }
  
  /* 설명란: Pretendard 아주 가늘게 */
  .desc-section { font-size: 0.9em; font-weight: 200; background: rgba(255,255,255,0.5); padding: 18px; border-radius: 16px; line-height: 1.7; word-break: keep-all; }

  @media (max-width: 800px) { .main-layout { flex-direction: column; align-items: center; } .generator-section { width: 100%; } }
</style>
</head>
<body>

<div class="main-layout">
  <div class="generator-section" id="generator-ui">
    <h3>플레이리스트 제너레이터</h3>
    <div class="config-row">
      <label>제목</label><input type="text" id="title-input" placeholder="Your Playlist">
    </div>
    <div class="config-row">
      <label>글자색</label><input type="color" id="text-color-input" value="#000000">
      <label>배경색</label><input type="color" id="box-color-input" value="#eef2f6">
    </div>
    
    <textarea id="data-input" placeholder="형식이 다음과 같은지 확인 후 붙여넣기(곡과 곡 사이 구분선 --- 필수)
곡명: 노래 제목
아티스트: 가수 이름
설명: 곡 설명
가사:
가사 1줄
가사 2줄
가사 3줄
가사 4줄"></textarea>
    <button class="btn" onclick="parseTextAndShowUpload()">1단계: 데이터 인식</button>
    
    <div id="image-upload-section">
      <h4 style="margin: 0 0 10px 0;">배경 이미지 첨부</h4>
      <div id="upload-list-container"></div>
      <button class="btn" style="margin-top:15px;" onclick="generateFinalPlaylist()">2단계: 플레이리스트 적용</button>
    </div>

    <div class="export-actions" id="export-actions">
      <button class="btn export-btn" onclick="copyHTML()">HTML 코드 복사하기</button>
      <button class="btn export-img-btn" onclick="exportImage()">이미지로 내보내기 (팝업)</button>
    </div>
  </div>

  <div class="player-wrapper" id="player-wrapper">
    <div class="panel">
      <div class="playlist-header" id="display-title">Your Playlist</div>
      <ul class="song-list" id="playlist-container"></ul>
    </div>
    <div class="panel details-panel">
      <div class="details-header" id="current-title"></div>
      <div class="lyrics-section" id="lyrics-container"></div>
      <div class="desc-section" id="desc-container"></div>
    </div>
  </div>
</div>

<script>
  let songData = [];
  let lyricTimer = null;

  function parseTextAndShowUpload() {
    const rawText = document.getElementById('data-input').value;
    if (!rawText.trim()) return alert("텍스트를 입력해주세요.");
    const blocks = rawText.split(/---+/);
    const parsedData = [];
    blocks.forEach(block => {
      const lines = block.trim().split('\n');
      if (lines.length < 3) return;
      const song = { title: '', artist: '', image: '', description: '', lyrics: [] };
      let isParsingLyrics = false;
      lines.forEach(line => {
        const tLine = line.trim();
        if (tLine.startsWith('곡명:')) song.title = tLine.replace('곡명:', '').trim();
        else if (tLine.startsWith('아티스트:')) song.artist = tLine.replace('아티스트:', '').trim();
        else if (tLine.startsWith('설명:')) song.description = tLine.replace('설명:', '').trim();
        else if (tLine.startsWith('가사:')) isParsingLyrics = true;
        else if (isParsingLyrics && tLine.length > 0) song.lyrics.push(tLine);
      });
      if (song.title) parsedData.push(song);
    });
    if(parsedData.length === 0) return alert("데이터를 찾을 수 없습니다.");
    songData = parsedData;
    const uploadContainer = document.getElementById('upload-list-container');
    uploadContainer.innerHTML = '';
    songData.forEach((song, index) => {
      const div = document.createElement('div');
      div.className = 'upload-item';
      div.innerHTML = `<strong>${song.title}</strong><input type="file" accept="image/*" onchange="handleImageSelect(${index}, this)">`;
      uploadContainer.appendChild(div);
    });
    document.getElementById('image-upload-section').style.display = 'block';
  }

  function handleImageSelect(index, inputElement) {
    const file = inputElement.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => { songData[index].image = e.target.result; };
      reader.readAsDataURL(file);
    }
  }

  function generateFinalPlaylist() {
    const title = document.getElementById('title-input').value || "Your Playlist";
    const textColor = document.getElementById('text-color-input').value;
    const boxColor = document.getElementById('box-color-input').value;
    document.getElementById('display-title').innerText = title;
    document.documentElement.style.setProperty('--text-color', textColor);
    document.documentElement.style.setProperty('--box-color', boxColor);
    const container = document.getElementById('playlist-container');
    container.innerHTML = '';
    songData.forEach((song, index) => {
      const li = document.createElement('li');
      li.className = 'song-item';
      li.innerHTML = `<div class="play-icon">▶</div><div class="song-info"><div class="song-title">${song.title}</div><div class="song-artist">${song.artist}</div></div><div class="more-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>`;
      li.onclick = () => selectSong(index, li);
      container.appendChild(li);
    });
    document.getElementById('player-wrapper').style.display = 'flex';
    document.getElementById('export-actions').style.display = 'flex';
    if(songData.length > 0) selectSong(0, container.firstChild);
  }

  function selectSong(index, element) {
    document.querySelectorAll('.song-item').forEach(item => item.classList.remove('active'));
    element.classList.add('active');
    const song = songData[index];
    document.getElementById('current-title').innerText = `${song.title} — ${song.artist}`;
    document.getElementById('desc-container').innerText = song.description;
    const lyricsContainer = document.getElementById('lyrics-container');
    if (song.image) { lyricsContainer.style.backgroundImage = `url('${song.image}')`; }
    else { lyricsContainer.style.backgroundColor = "#333"; lyricsContainer.style.backgroundImage = "none"; }
    lyricsContainer.innerHTML = '';
    song.lyrics.forEach(line => {
      const div = document.createElement('div');
      div.className = 'lyric-line';
      div.innerText = line;
      lyricsContainer.appendChild(div);
    });
    startLyricAnimation(lyricsContainer);
  }

  function startLyricAnimation(container) {
    clearInterval(lyricTimer);
    const lines = container.querySelectorAll('.lyric-line');
    if (lines.length === 0) return;
    let idx = 0; lines[0].classList.add('active-lyric');
    lyricTimer = setInterval(() => {
      lines[idx].classList.remove('active-lyric');
      idx = (idx + 1) % lines.length;
      lines[idx].classList.add('active-lyric');
    }, 2000);
  }

  function exportImage() {
    const target = document.getElementById('player-wrapper');
    html2canvas(target, { backgroundColor: '#f4f7f6', scale: 3 }).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      const modal = document.createElement('div');
      modal.style = "position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;";
      modal.innerHTML = `<div style="color:#fff;margin-bottom:20px;font-weight:bold;">이미지를 길게 눌러 저장하세요</div><img src="${imgData}" style="max-width:90%;max-height:75%;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,0.5);"><button onclick="document.body.removeChild(this.parentNode)" style="margin-top:20px;padding:12px 30px;background:#fff;border:none;border-radius:30px;font-weight:bold;cursor:pointer;">닫기</button>`;
      document.body.appendChild(modal);
    });
  }

  function copyHTML() {
    const title = document.getElementById('title-input').value || "Your Playlist";
    const textColor = document.getElementById('text-color-input').value;
    const boxColor = document.getElementById('box-color-input').value;
    const htmlTemplate = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');:root{--text-color:${textColor};--box-color:${boxColor}}body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#f4f7f6;color:var(--text-color);margin:0;display:flex;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}.player-wrapper{display:flex;flex-direction:column;width:100%;max-width:400px;gap:15px;margin:0 auto}.player-wrapper *{box-sizing:border-box;letter-spacing:-.02em;margin:0;padding:0}.panel{background:var(--box-color);border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}.playlist-header{font-size:1.4em;font-weight:800;margin-bottom:20px}.song-list{list-style:none}.song-item{display:flex;align-items:center;background:rgba(255,255,255,.6);border-radius:16px;margin-bottom:12px;padding:14px;cursor:pointer;transition:.2s}.song-item.active{background:#fff;transform:scale(1.02);box-shadow:0 4px 15px rgba(0,0,0,.05)}.play-icon{width:32px;height:32px;flex-shrink:0;background:var(--text-color);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-right:14px;font-size:10px}.song-info{flex:1;overflow:hidden}.song-title{font-size:1em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}.song-artist{font-size:.85em;font-weight:400;opacity:.6}.more-icon{display:flex;align-items:center;opacity:.3;margin-left:10px}.details-panel{display:flex;flex-direction:column;gap:15px}.details-header{font-size:1.1em;font-weight:700;margin-bottom:5px;border-bottom:1px solid rgba(0,0,0,.1);padding-bottom:10px}.lyrics-section{position:relative;border-radius:18px;min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;background-size:cover;background-position:center;box-shadow:inset 0 0 0 2000px rgba(0,0,0,.55);padding:20px}.lyric-line{font-size:1.05em;font-weight:500;color:rgba(255,255,255,.5);margin:6px 0;transition:all .4s cubic-bezier(.4,0,.2,1);z-index:1;word-break:keep-all}.lyric-line.active-lyric{color:#fff;font-weight:800;transform:scale(1.1);text-shadow:0 0 15px rgba(255,255,255,.3)}.desc-section{font-size:.9em;font-weight:200;background:rgba(255,255,255,.5);padding:18px;border-radius:16px;line-height:1.7;word-break:keep-all}</style></head><body><div class="player-wrapper"><div class="panel"><div class="playlist-header">${title}</div><ul class="song-list" id="p-c"></ul></div><div class="panel details-panel"><div class="details-header" id="c-t"></div><div class="lyrics-section" id="l-c"></div><div class="desc-section" id="d-c"></div></div></div><script>const sD=${JSON.stringify(songData)};let lT=null;function init(){const c=document.getElementById('p-c');sD.forEach((s,i)=>{const li=document.createElement('li');li.className='song-item';li.innerHTML='<div class="play-icon">▶</div><div class="song-info"><div class="song-title">'+s.title+'</div><div class="song-artist">'+s.artist+'</div></div><div class="more-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>';li.onclick=()=>sel(i,li);c.appendChild(li)});if(sD.length>0)sel(0,c.firstChild)}function sel(i,e){document.querySelectorAll('.song-item').forEach(m=>m.classList.remove('active'));e.classList.add('active');const s=sD[i];document.getElementById('c-t').innerText=s.title+' — '+s.artist;document.getElementById('d-c').innerText=s.description;const lc=document.getElementById('l-c');if(s.image){lc.style.backgroundImage="url('"+s.image+"')"}else{lc.style.backgroundColor="#333";lc.style.backgroundImage="none"}lc.innerHTML='';s.lyrics.forEach(l=>{const d=document.createElement('div');d.className='lyric-line';d.innerText=l;lc.appendChild(d)});ani(lc)}function ani(c){clearInterval(lT);const n=c.querySelectorAll('.lyric-line');if(n.length===0)return;let x=0;n[0].classList.add('active-lyric');lT=setInterval(()=>{n[x].classList.remove('active-lyric');x=(x+1)%n.length;n[x].classList.add('active-lyric')},2000)}window.onload=init;<\/script></body></html>`;
    navigator.clipboard.writeText(htmlTemplate).then(()=>{alert("HTML 복사 완료!")});
  }
</script>
</body>
</html>
